# maistro configuration (sourced by bash). Commit this file so your team shares it.
# maistro keeps everything inside .maistro/: plans and the CONTEXT.md glossary in .maistro/plans/,
# worker worklogs in .maistro/worklogs/. These locations are fixed and not configurable.

# Branch that workers branch from and PRs target. Empty = auto-detect (origin/HEAD, then main/master).
MAISTRO_BASE_BRANCH=""

# Coding agent that runs Maistro and the workers. Only claude-code is supported today.
MAISTRO_HARNESS="claude-code"

# Maximum number of workers running at the same time.
MAISTRO_MAX_PARALLEL=4

# Permission mode for workers: auto (recommended), acceptEdits, default, or bypassPermissions.
# With acceptEdits or default, workers stop and wait for approval on shell commands;
# you'll see them waiting in their tmux windows.
MAISTRO_WORKER_PERMISSION_MODE="auto"

# tmux session name. Empty = "maistro-<repo-folder-name>".
MAISTRO_SESSION=""

# tmux status line: minimal (a quiet window list with key hints), off (hidden), or tmux (your own style).
MAISTRO_TMUX_STATUS="minimal"

# Mouse mode: on lets the wheel scroll back through output like a normal terminal, and clicking a window
# name switches to it. Hold Option (iTerm2) or Fn (Terminal.app) while dragging to select text natively.
MAISTRO_TMUX_MOUSE="on"

# Lines of scrollback kept per window.
MAISTRO_TMUX_HISTORY=50000

# How PRs are reviewed and merged: auto, github, or local.
# auto = GitHub PRs when origin is a GitHub remote and gh is logged in; otherwise local reviews and merges
# with plain git (no remote needed). Connecting a remote later switches automatically.
MAISTRO_REVIEW_MODE="auto"

# How maistro-merge merges PRs: squash, merge, or rebase (rebase needs GitHub; local merges squash instead).
MAISTRO_MERGE_METHOD="squash"

# Model for the Maistro session itself. Empty = your Claude Code default.
MAISTRO_MAISTRO_MODEL=""
