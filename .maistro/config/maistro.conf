# maistro configuration (sourced by bash). Commit this file so your team shares it.

# Branch that workers branch from and PRs target. Empty = auto-detect (origin/HEAD, then main/master).
MAISTRO_BASE_BRANCH=""

# Coding agent that runs Maistro and the workers. Only claude-code is supported today.
MAISTRO_HARNESS="claude-code"

# Maximum number of workers running at the same time.
MAISTRO_MAX_PARALLEL=4

# Permission mode for workers: auto (recommended), acceptEdits, default, or bypassPermissions.
# With acceptEdits or default, workers stop and wait for approval on shell commands;
# you'll see them waiting in their tmux windows.
MAISTRO_WORKER_PERMISSION_MODE="auto"

# Where each worker commits its worklog, relative to the repo root.
MAISTRO_WORKLOG_DIR="docs/worklogs"

# tmux session name. Empty = "maistro-<repo-folder-name>".
MAISTRO_SESSION=""

# Folder for plans (specs, tickets, decisions), relative to the repo root.
MAISTRO_PLANS_DIR="plans"   # if you change this, update Edit(plans/**) in maistro-settings.json

# How maistro-merge merges PRs: squash, merge, or rebase.
MAISTRO_MERGE_METHOD="squash"

# Model for the Maistro session itself. Empty = your Claude Code default.
MAISTRO_MAISTRO_MODEL=""
